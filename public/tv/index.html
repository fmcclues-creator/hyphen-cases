<style>
:root{--ink:#0d1016;--fg:#e9ecf2;--muted:#8e97a8;--line:#283040;--gold:#ffd978;--ok:#3aa36a;--tape:#c4382d;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--ink);color:var(--fg);font-family:Tajawal,system-ui,sans-serif;overflow:hidden}
.scr{position:absolute;inset:0;display:none}.scr.on{display:flex}
#join{flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#join .brand{font-size:14px;letter-spacing:4px;color:var(--muted)}
#join h1{font-size:clamp(28px,5vw,56px);margin:0}
#join p{color:var(--muted);font-size:clamp(16px,2.2vw,24px);margin:0;line-height:1.7;max-width:40ch}
#code{font:700 clamp(40px,8vw,96px)/1 ui-monospace,Menlo,monospace;letter-spacing:.35em;text-align:center;width:min(90vw,520px);padding:16px 0 16px .35em;background:#161b24;border:2px solid var(--line);border-radius:18px;color:#fff;direction:ltr;outline:none}
#code:focus{border-color:var(--gold)}
.btn{background:var(--tape);color:#fff;border:0;border-radius:999px;padding:16px 40px;font:700 clamp(18px,2.4vw,26px) Tajawal,sans-serif;cursor:pointer}
.err{color:#e2574b;min-height:1.5em;font-size:18px}
.stat{position:absolute;top:18px;inset-inline:24px;display:flex;align-items:center;gap:14px;font-size:clamp(14px,1.8vw,22px);color:var(--muted);z-index:5}
.stat .room{font-family:ui-monospace,Menlo,monospace;letter-spacing:.2em;color:#fff;background:#161b24;border:1px solid var(--line);border-radius:10px;padding:4px 12px;direction:ltr}
.stat .sp{flex:1}.stat .dot{width:12px;height:12px;border-radius:50%;background:#555}.stat .dot.live{background:var(--ok);box-shadow:0 0 10px var(--ok)}
#stage{position:absolute;inset:0;background:#000}
.dark,.lit{position:absolute;inset:0;background-size:contain;background-position:center;background-repeat:no-repeat}
.dark{filter:brightness(.08) saturate(.4)}
.lit{opacity:0;transition:opacity .3s;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.lit.full{-webkit-mask-image:none!important;mask-image:none!important}
.marks{position:absolute;inset:0;pointer-events:none}
.mark{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .4s}
.mark i{width:clamp(28px,3vw,44px);height:clamp(28px,3vw,44px);border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 18px var(--gold);display:block}
.mark span{background:rgba(0,0,0,.8);color:var(--gold);font-size:clamp(14px,1.8vw,24px);padding:6px 14px;border-radius:8px;white-space:nowrap}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.wait{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.75);z-index:4;text-align:center;padding:24px}
.wait.on{display:flex}
.wait h2{font-size:clamp(24px,3.5vw,44px);margin:0}.wait p{color:var(--muted);font-size:clamp(16px,2vw,24px);margin:0;max-width:44ch;line-height:1.7}
.done{position:absolute;inset-inline:0;bottom:6vh;display:none;justify-content:center;z-index:5}
.done.on{display:flex}
.done div{background:rgba(0,0,0,.85);border:1px solid var(--gold);color:#fff;font-size:clamp(18px,2.6vw,34px);padding:16px 30px;border-radius:16px;max-width:80vw;text-align:center;line-height:1.6}
.title{position:absolute;top:60px;inset-inline:0;text-align:center;color:var(--gold);font-size:clamp(16px,2.2vw,28px);z-index:5;text-shadow:0 2px 8px #000}
.counter{position:absolute;bottom:24px;left:24px;font:700 clamp(16px,2vw,26px) ui-monospace,Menlo,monospace;color:var(--gold);direction:ltr;z-index:5;background:rgba(0,0,0,.6);padding:6px 14px;border-radius:10px}

#runScr{position:absolute;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,34px);background:linear-gradient(#141a24,#0a0c10 65%,#241f16);text-align:center;padding:4vh 4vw}
#runScr.on{display:flex}
#runScr .ttl{font:800 clamp(18px,2.4vw,34px)/1.3 Tajawal,sans-serif;color:#e9ecf2}
#runScr .clock{font:900 clamp(70px,16vw,220px)/1 ui-monospace,Menlo,monospace;color:var(--gold);direction:ltr}
#runScr .sub{font:700 clamp(14px,1.6vw,22px) Tajawal,sans-serif;color:#aab2c2}
#runScr .track{width:min(88vw,1100px)}
#runScr .path{position:relative;height:clamp(50px,8vh,96px)}
#runScr .me{position:absolute;inset-inline-start:0;bottom:0;font-size:clamp(34px,6vw,76px);transform:scaleX(-1);transition:inset-inline-start .25s}
#runScr .goal{position:absolute;inset-inline-end:0;bottom:6px;font-size:clamp(30px,5vw,64px)}
#runScr .bar{height:clamp(14px,2.2vh,26px);border-radius:14px;background:#2c3139;overflow:hidden}
#runScr .bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#3aa36a,#ffd978);transition:width .25s}
#runScr .dist{margin-top:10px;font:700 clamp(16px,2vw,30px) ui-monospace,Menlo,monospace;color:var(--gold)}
#runScr .res{font:900 clamp(22px,3.4vw,54px)/1.4 Tajawal,sans-serif}
#runScr .res.win{color:#4ad07e}#runScr .res.fail{color:#e4584a}
/* the chase is a shot you watch: سالم running, at the team's own pace */
#runScr .runvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0;transition:opacity .6s;filter:brightness(.85)}
#runScr .runvid.on{opacity:1}
#runScr.hasvid{background:#000;justify-content:space-between;padding:3vh 4vw 4vh}
#runScr.hasvid::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.6),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 60%,rgba(0,0,0,.8))}
#runScr.hasvid>*:not(video){position:relative;z-index:2}
#runScr.hasvid .ttl,#runScr.hasvid .sub{text-shadow:0 2px 10px rgba(0,0,0,.95)}
#runScr.hasvid .clock{font-size:clamp(56px,11vw,150px);text-shadow:0 3px 18px rgba(0,0,0,.95)}
#runScr.hasvid .sub{margin-top:-1vh}
#runScr.hasvid .res{order:2;flex:1;display:flex;align-items:center;text-shadow:0 2px 14px rgba(0,0,0,.95)}
#runScr.hasvid .track{order:3;background:rgba(0,0,0,.45);border-radius:18px;padding:10px 22px 14px}
#runScr.hasvid .bar{background:rgba(255,255,255,.14)}
#runScr.hasvid .dist{text-shadow:0 1px 8px rgba(0,0,0,.9)}
@media (prefers-reduced-motion:reduce){#runScr .runvid{display:none}}
</style>
</head>
<body>
<section class="scr on" id="join">
  <div class="brand">HYPHEN · CASES</div>
  <h1>📺 شاشة التلفزيون</h1>
  <p>لما تطلع عندكم مهمة الكشّاف بالموبايل، اكتبوا هنا الكود اللي يبين على الموبايل.</p>
  <input id="code" inputmode="numeric" maxlength="4" placeholder="····" autocomplete="off">
  <button class="btn" id="go">اتصال</button>
  <div class="err" id="err"></div>
</section>

<section class="scr" id="play">
  <div class="stat"><span class="room" id="roomLbl"></span><span id="st">بانتظار الموبايل…</span><span class="sp"></span><span class="dot" id="dot"></span></div>
  <div id="stage">
    <div class="dark" id="dark"></div>
    <div class="lit" id="lit"></div>
    <div class="marks" id="marks"></div>
    <div class="title" id="ttl"></div>
    <div class="counter" id="cnt"></div>
    <div class="wait on" id="wait"><h2>متصل ✓</h2><p id="waitTx">الشاشة جاهزة. على الموبايل اضغطوا «🔦 شغّلوا الكشّاف» أو «🏃 لحقوه».</p></div>
    <div id="runScr">
  <div class="ttl" id="runTtl">🏃 المطاردة — واحد يركض للمواقف</div>
  <div class="clock" id="runT">60</div>
  <div class="sub">ثانية قبل ما يوصل سيارته</div>
  <div class="track"><div class="path"><i class="me" id="runMe">🏃</i><span class="goal">🚗</span></div>
    <div class="bar"><b id="runB"></b></div><div class="dist" id="runD">٨٠ م</div></div>
  <div class="res" id="runR"></div>
</div>
    <div class="done" id="done"><div id="doneTx"></div></div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s);
let sb=null,ch=null,room='',scene=null,beam={x:50,y:50},tx=50,ty=50,raf=0,found={};
async function cfg(){try{const r=await fetch('/api/tv-config');const j=await r.json();if(j.ok)return j}catch(e){}return null}
function base(){return location.origin}
$('#code').addEventListener('input',e=>{e.target.value=e.target.value.replace(/[^0-9٠-٩]/g,'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).slice(0,4);if(e.target.value.length===4)join()});
$('#code').addEventListener('keydown',e=>{if(e.key==='Enter')join()});
$('#go').onclick=join;
const m=(location.hash||'').match(/room=(\d{4})/);if(m){$('#code').value=m[1];setTimeout(join,300)}
async function join(){const c=$('#code').value;if(c.length!==4){$('#err').textContent='اكتبوا ٤ أرقام';return}$('#err').textContent='';$('#go').disabled=true;
  const j=await cfg();if(!j){$('#err').textContent='شاشة التلفزيون مو مفعّلة بعد (مفتاح Supabase ناقص).';$('#go').disabled=false;return}
  sb=sb||supabase.createClient(j.url,j.key,{realtime:{params:{eventsPerSecond:40}}});room=c;
  ch=sb.channel('tv-'+room,{config:{broadcast:{self:false}}});
  ch.on('broadcast',{event:'scene'},({payload})=>setScene(payload))
    .on('broadcast',{event:'beam'},({payload})=>{tx=payload.x;ty=payload.y;if(payload.on!==undefined)setOn(payload.on)})
    .on('broadcast',{event:'found'},({payload})=>mark(payload))
    .on('broadcast',{event:'done'},({payload})=>finish(payload))
    .on('broadcast',{event:'run'},({payload})=>runShow(payload))
    .on('broadcast',{event:'bye'},()=>{$('#st').textContent='الموبايل طلع من المشهد';$('#wait').classList.add('on');$('#waitTx').textContent='ارجعوا للمشهد من الموبايل.'})
    .subscribe(status=>{if(status==='SUBSCRIBED'){$('#join').classList.remove('on');$('#play').classList.add('on');$('#roomLbl').textContent=room;$('#dot').classList.add('live');hello();setInterval(hello,3000)}
      else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){$('#err').textContent='ما قدرنا نتصل. جرّبوا مرة ثانية.';$('#go').disabled=false}});
  if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})}
function hello(){if(ch)ch.send({type:'broadcast',event:'hello',payload:{t:Date.now(),scene:scene?scene.id:null}})}
function setScene(sc){const rs=document.getElementById('runScr');if(rs)rs.classList.remove('on');if(scene&&scene.id===sc.id&&scene.seq===sc.seq)return;scene=sc;found={};$('#marks').innerHTML='';$('#done').classList.remove('on');$('#dark').style.backgroundImage=`url(${sc.base}/img/${sc.dark}.jpg)`;$('#lit').style.backgroundImage=`url(${sc.base}/img/${sc.lit}.jpg)`;$('#lit').classList.remove('full');$('#lit').style.opacity=0;$('#ttl').textContent=sc.title||'';$('#cnt').textContent=`0 / ${sc.n}`;$('#st').textContent='المشهد جاهز';$('#wait').classList.remove('on');
  if(sc.on)setOn(true);(sc.found||[]).forEach(mark);if(sc.done)finish({text:sc.doneText});cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function setOn(on){$('#lit').style.opacity=on?1:0;$('#st').textContent=on?'🔦 الكشّاف شغّال — ميّلوا الموبايل':'المشهد جاهز'}
/* image is drawn with background-size:contain, so convert % of image → % of stage */
function imgRect(){const st=$('#stage').getBoundingClientRect();const ar=scene&&scene.ar?scene.ar:16/9;let w=st.width,h=w/ar;if(h>st.height){h=st.height;w=h*ar}return{x:(st.width-w)/2,y:(st.height-h)/2,w,h,W:st.width,H:st.height}}
function toStage(px,py){const r=imgRect();return{x:(r.x+px/100*r.w)/r.W*100,y:(r.y+py/100*r.h)/r.H*100}}
function loop(){beam.x+=(tx-beam.x)*0.2;beam.y+=(ty-beam.y)*0.2;const p=toStage(beam.x,beam.y);const r=imgRect();const rad=Math.max(90,r.w*0.085);const m=`radial-gradient(circle at ${p.x}% ${p.y}%, #000 0 ${rad}px, transparent ${rad*1.7}px)`;const l=$('#lit');if(!l.classList.contains('full')){l.style.webkitMaskImage=m;l.style.maskImage=m}raf=requestAnimationFrame(loop)}
function mark(s){if(found[s.i])return;found[s.i]=true;const p=toStage(s.x,s.y);$('#marks').insertAdjacentHTML('beforeend',`<div class="mark" style="left:${p.x}%;top:${p.y}%"><i></i><span>${s.l}</span></div>`);$('#cnt').textContent=`${Object.keys(found).length} / ${scene?scene.n:'?'}`;try{ding()}catch(e){}}

/* ---- chase ---- */
const AR_=n=>String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
/* the running clip: the phone only sends the step count, so the TV reads the
   team's pace off how fast that count climbs and plays the shot at that speed */
const RV={el:null,log:[],have:0.07,raf:0,last:0,steps:-1,state:''};
function rvInit(){
  if(RV.el)return;const sc=document.getElementById('runScr');
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const v=document.createElement('video');v.className='runvid';v.loop=true;v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';
  ['/shaleh/video/run.webm|video/webm','/shaleh/video/run.mp4|video/mp4'].forEach(s=>{const [src,type]=s.split('|');const el=document.createElement('source');el.src=src;el.type=type;v.appendChild(el)});
  const drop=()=>{sc.classList.remove('hasvid');v.remove();RV.el=null};
  v.addEventListener('error',drop);
  const deadline=setTimeout(()=>{if(RV.el===v&&v.readyState<2)drop()},6000);
  v.addEventListener('loadeddata',()=>{clearTimeout(deadline);sc.classList.add('hasvid')});
  sc.insertBefore(v,sc.firstChild);RV.el=v;
}
function rvGo(){if(!RV.el)return;RV.log=[];RV.have=0.07;RV.last=performance.now();try{RV.el.currentTime=0}catch(e){}try{RV.el.playbackRate=0.07}catch(e){}try{const p=RV.el.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}RV.el.classList.add('on');cancelAnimationFrame(RV.raf);RV.raf=requestAnimationFrame(rvTick)}
function rvHold(){cancelAnimationFrame(RV.raf);RV.raf=0;if(RV.el)try{RV.el.pause()}catch(e){}}
function rvSteps(n){const now=performance.now();if(RV.steps>=0&&n>RV.steps){const d=n-RV.steps;for(let i=0;i<d;i++)RV.log.push(now-(d-1-i)*120)}RV.steps=n;while(RV.log.length>6)RV.log.shift()}
function rvTick(now){
  if(!RV.el){RV.raf=0;return}
  const dt=Math.min(0.1,(now-RV.last)/1000);RV.last=now;let cad=0;
  if(RV.log.length>1){const span=(RV.log[RV.log.length-1]-RV.log[0])/1000;cad=span>0?(RV.log.length-1)/span:0;
    const since=(now-RV.log[RV.log.length-1])/1000;if(since>1.1)cad=0;else if(since>0.55)cad*=0.45}
  const want=Math.max(0.07,Math.min(2.2,cad/2.5));RV.have+=(want-RV.have)*Math.min(1,dt*5.5);
  try{RV.el.playbackRate=RV.have}catch(e){}RV.raf=requestAnimationFrame(rvTick)}
function runShow(p){const sc=document.getElementById('runScr');if(!sc)return;
 if(p.state==='bye'){sc.classList.remove('on');rvHold();RV.state='';return}
 sc.classList.add('on');document.getElementById('wait').classList.remove('on');
 rvInit();
 if(p.state==='run'){if(RV.state!=='run'){RV.steps=-1;rvGo()}rvSteps(p.steps||0)}
 else{rvHold();if(p.state==='idle'&&RV.el){try{RV.el.currentTime=0}catch(e){}RV.el.classList.add('on')}}
 RV.state=p.state;
 const need=p.need||70,steps=Math.min(need,p.steps||0),f=steps/need;
 document.getElementById('runT').textContent=Math.max(0,p.t|0);
 document.getElementById('runB').style.width=(f*100)+'%';
 document.getElementById('runMe').style.insetInlineStart=(f*88)+'%';
 document.getElementById('runD').textContent=AR_(Math.round(80*(1-f)))+' م';
 const r=document.getElementById('runR');
 r.className='res'+(p.state==='win'?' win':p.state==='fail'?' fail':'');
 r.textContent=p.state==='win'?'🏁 مسكتوا سالم قبل ما ينحاش!':p.state==='fail'?'❌ ركب سيارته وطلع.':'';
 document.getElementById('st').textContent=p.state==='run'?'🏃 المطاردة شغّالة':'المطاردة جاهزة';
 if(p.state==='win')try{ding()}catch(e){}}
function finish(p){$('#lit').classList.add('full');$('#lit').style.opacity=1;$('#doneTx').textContent=p.text||'';$('#done').classList.add('on');$('#st').textContent='اكتمل المشهد ✅'}
window.addEventListener('resize',()=>{$('#marks').innerHTML='';const f=found;found={};if(scene)(scene.found||[]).concat(Object.keys(f).map(i=>scene.spots&&scene.spots[i]).filter(Boolean)).forEach(mark)});
let ac;function ding(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.setValueAtTime(.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.35);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.4)}
</script>
</body>
